<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0015">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casino 3D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🎰 Casino 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; font-family:Arial,sans-serif; overscroll-behavior:none; }
  #game { position:fixed; inset:0; }

  /* ============= ЭКРАН ВЫБОРА ПЛАТФОРМЫ ============= */
  #platformScreen {
    position:fixed; inset:0; z-index:300;
    background:radial-gradient(circle at 50% 50%, #1a0033 0%, #000 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px; gap:30px;
  }
  #platformScreen h1 {
    color:#ffd700; font-size:32px; font-weight:bold;
    text-shadow:0 0 25px #ffd700, 0 0 50px #ff8c00;
    text-align:center; letter-spacing:3px;
    font-family:'Courier New',monospace;
  }
  #platformScreen p {
    color:#aaa; font-size:14px; text-align:center;
    margin-top:-15px; letter-spacing:1px;
  }
  .platBtn {
    width:min(280px, 80vw);
    padding:22px 30px;
    border-radius:20px;
    border:3px solid #ffd700;
    background:linear-gradient(145deg, #2a0055, #150033);
    color:#fff; font-size:20px; font-weight:bold;
    font-family:'Courier New',monospace;
    cursor:pointer;
    box-shadow:0 0 25px rgba(255,215,0,0.3);
    transition:all 0.15s;
    display:flex; align-items:center; justify-content:center; gap:15px;
  }
  .platBtn:active, .platBtn:hover {
    transform:scale(1.04);
    box-shadow:0 0 40px rgba(255,215,0,0.7);
    background:linear-gradient(145deg, #3a0075, #250044);
  }
  .platBtn .emoji { font-size:36px; }
  .platBtn .label { display:flex; flex-direction:column; align-items:flex-start; }
  .platBtn .label small { font-size:11px; color:#ffd700; font-weight:normal; margin-top:2px; letter-spacing:0; }

  /* ============= ПК-подсказки сверху ============= */
  #pcHint {
    position:fixed; top:15px; left:50%; transform:translateX(-50%);
    z-index:50;
    display:none;
    gap:14px;
    padding:10px 22px;
    background:rgba(0,0,0,0.75);
    border:2px solid #ffd700;
    border-radius:14px;
    color:#fff; font-family:'Courier New',monospace;
    font-size:13px; font-weight:bold;
    box-shadow:0 0 20px rgba(255,215,0,0.4);
    align-items:center;
    white-space:nowrap;
  }
  #pcHint.show { display:flex; }
  #pcHint .key {
    display:inline-block;
    padding:3px 9px;
    background:linear-gradient(145deg, #ffd700, #cc8800);
    color:#000; border-radius:6px;
    font-weight:bold; font-size:12px;
    box-shadow:0 2px 0 #885500, inset 0 1px 0 rgba(255,255,255,0.5);
    margin:0 3px;
  }
  #pcHint .sep { color:#666; }

  /* ============= ПРИЦЕЛ ============= */
  #crosshair {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:14px; height:14px; border:2px solid rgba(255,255,255,0.9);
    border-radius:50%; pointer-events:none; z-index:10;
    box-shadow:0 0 6px rgba(0,0,0,0.9);
    transition: all 0.12s;
  }
  #crosshair::after {
    content:''; position:absolute; top:50%; left:50%;
    width:2px; height:2px; background:#fff; border-radius:50%;
    transform:translate(-50%,-50%);
  }
  #crosshair.target {
    border-color:#ffd700; width:18px; height:18px;
    box-shadow:0 0 15px #ffd700, 0 0 6px #000;
  }

  #hud {
    position:fixed; top:15px; left:15px; z-index:10;
    color:#ffd700; font-size:18px; font-weight:bold;
    padding:8px 18px; background:rgba(0,0,0,0.65);
    border:2px solid #ffd700; border-radius:25px;
    text-shadow:0 0 10px #ffd700;
    font-family:'Courier New',monospace;
  }

  #fps {
    position:fixed; top:60px; left:15px; z-index:10;
    color:#0f0; font-size:11px; font-weight:bold;
    padding:4px 10px; background:rgba(0,0,0,0.65);
    border-radius:10px; font-family:'Courier New',monospace;
  }

  #musicBtn {
    position:fixed; top:60px; right:15px; z-index:11;
    width:44px; height:44px; border-radius:50%;
    background:rgba(0,0,0,0.7);
    border:2px solid #ffd700;
    color:#ffd700; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #musicBtn:active { transform:scale(0.9); }
  #musicBtn.off { opacity:0.5; color:#888; border-color:#444; }

  #hint {
    position:fixed; top:70px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:14px; padding:8px 18px;
    background:rgba(0,0,0,0.75); border-radius:18px;
    z-index:10; display:none; text-align:center; white-space:nowrap;
    border:1px solid #ffd700;
    pointer-events:none;
  }

  /* Джойстик (только для ТФ) */
  #stick {
    position:fixed; bottom:30px; left:30px;
    width:130px; height:130px; border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(100,170,255,0.15), rgba(0,50,120,0.25));
    border:3px solid rgba(150,200,255,0.6);
    z-index:11;
    box-shadow:0 0 25px rgba(100,170,255,0.4), inset 0 0 20px rgba(100,170,255,0.2);
    display:none;
  }
  #stick.show { display:block; }
  #stickKnob {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:60px; height:60px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #aaddff, #4488dd, #003366);
    border:2px solid #cceeFF;
    box-shadow:0 4px 15px rgba(0,0,0,0.7), inset 0 0 10px rgba(255,255,255,0.4);
    pointer-events:none;
  }
  #stick::before {
    content:'ДВИЖЕНИЕ';
    position:absolute; top:-24px; left:50%; transform:translateX(-50%);
    color:#aaddff; font-size:11px; font-weight:bold;
    letter-spacing:1px; white-space:nowrap;
    text-shadow:0 0 6px #000;
  }

  #actionBtn {
    position:fixed; bottom:150px; right:60px;
    padding:16px 34px;
    border-radius:50px;
    background:radial-gradient(circle at 30% 30%, #ff6688, #cc0033, #660018);
    color:#fff; font-size:16px; font-weight:bold;
    border:3px solid #ffd700; z-index:11; display:none;
    box-shadow:0 0 30px #ff4466;
    animation: pulse 0.9s infinite;
    text-shadow:0 1px 3px #000;
    letter-spacing:1px;
  }
  @keyframes pulse {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.08); }
  }

  #loading {
    position:fixed; inset:0; background:#000; z-index:200;
    display:flex; align-items:center; justify-content:center;
    color:#ffd700; font-size:20px; font-weight:bold;
    font-family:'Courier New',monospace;
  }

  #rotateTip {
    position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:190;
    display:none; align-items:center; justify-content:center;
    color:#ffd700; font-size:18px; font-weight:bold; text-align:center;
    padding:30px; flex-direction:column; gap:20px;
  }
  @media (orientation: portrait) {
    #rotateTip.show { display:flex; }
  }
</style>
</head>
<body>

<div id="loading">🎰 Загрузка Casino 3D...</div>

<!-- ЭКРАН ВЫБОРА ПЛАТФОРМЫ -->
<div id="platformScreen">
  <h1>🎰 CASINO 3D</h1>
  <p>Выбери способ управления</p>

  <button class="platBtn" id="btnPC">
    <span class="emoji">🖥️</span>
    <span class="label">
      Играть с ПК
      <small>WASD · мышь · E · M</small>
    </span>
  </button>

  <button class="platBtn" id="btnPhone">
    <span class="emoji">📱</span>
    <span class="label">
      Играть с телефона
      <small>Свайп · джойстик · тап</small>
    </span>
  </button>
</div>

<!-- ПК-подсказки сверху -->
<div id="pcHint">
  <span><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Движение</span>
  <span class="sep">·</span>
  <span>🖱️ Мышь — обзор</span>
  <span class="sep">·</span>
  <span><span class="key">E</span> Использовать</span>
  <span class="sep">·</span>
  <span><span class="key">M</span> Музыка</span>
</div>

<div id="rotateTip">
  <div style="font-size:60px">📱↻</div>
  <div>Поверни телефон<br>горизонтально!</div>
</div>

<div id="game"></div>
<div id="crosshair"></div>
<div id="hud">💰 <span id="balance">1000</span> ₽</div>
<div id="fps">FPS: --</div>
<button id="musicBtn" class="off" title="Музыка">🔇</button>
<div id="hint"></div>

<div id="stick">
  <div id="stickKnob"></div>
</div>

<button id="actionBtn">🎰 ДЁРНУТЬ РЫЧАГ</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
//  🎵 МУЗЫКА — вставь путь к своему треку
// ============================================================
const MUSIC_URL = 'music.mp3';
const USE_CUSTOM_MUSIC = MUSIC_URL.length > 0;

// ================= СОСТОЯНИЕ =================
let balance = 1000;
const BET = 50;
let nearMachine = null;
let spinning = false;

// Режим управления: 'pc' или 'phone' (выбирается на старте)
let controlMode = null;

// ================= ЭКРАН ВЫБОРА ПЛАТФОРМЫ =================
const platformScreen = document.getElementById('platformScreen');
const pcHintEl = document.getElementById('pcHint');
const stickEl = document.getElementById('stick');
const rotateTip = document.getElementById('rotateTip');

document.getElementById('btnPC').addEventListener('click', () => {
  controlMode = 'pc';
  startGame();
});

document.getElementById('btnPhone').addEventListener('click', () => {
  controlMode = 'phone';
  stickEl.classList.add('show');
  rotateTip.classList.add('show');
  startGame();
});

function startGame() {
  platformScreen.style.display = 'none';
  if (controlMode === 'pc') {
    pcHintEl.classList.add('show');
    setupPCControls();
  } else {
    setupPhoneControls();
  }
  startMusic();

  // Убираем экран загрузки
  document.getElementById('loading').style.display = 'none';
}

// ================= СЦЕНА =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08000f);
scene.fog = new THREE.FogExp2(0x08000f, 0.022);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 80);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({
  antialias: window.devicePixelRatio < 2,
  powerPreference: 'high-performance',
  stencil: false
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('game').appendChild(renderer.domElement);

// ================= ОСВЕЩЕНИЕ =================
scene.add(new THREE.AmbientLight(0x553377, 0.8));
scene.add(new THREE.HemisphereLight(0x8866cc, 0x110022, 0.35));

const dirLight = new THREE.DirectionalLight(0xffddaa, 0.6);
dirLight.position.set(5, 15, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
dirLight.shadow.camera.far = 40;
dirLight.shadow.bias = -0.001;
scene.add(dirLight);

const lampData = [
  { x:-12, z:-12, c:0xff0088 },
  { x: 12, z:-12, c:0x00ddff },
  { x:-12, z: 12, c:0xffcc00 },
  { x: 12, z: 12, c:0x00ff99 },
];
lampData.forEach(p => {
  const l = new THREE.PointLight(p.c, 1.2, 20, 2);
  l.position.set(p.x, 6.5, p.z);
  scene.add(l);
  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 12, 12),
    new THREE.MeshBasicMaterial({ color: p.c })
  );
  bulb.position.set(p.x, 7.2, p.z);
  scene.add(bulb);
});

// ================= ПОЛ =================
const floorTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#150525';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 200; i++) {
    const x = Math.random()*256, y = Math.random()*256;
    ctx.fillStyle = `rgba(${40+Math.random()*40}, ${10+Math.random()*20}, ${60+Math.random()*40}, 0.2)`;
    ctx.beginPath();
    ctx.arc(x, y, Math.random()*30, 0, Math.PI*2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  return tex;
})();

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.4, metalness: 0.5 })
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const carpet = new THREE.Mesh(
  new THREE.PlaneGeometry(5, 50),
  new THREE.MeshStandardMaterial({ color:0x6b0018, roughness:0.95 })
);
carpet.rotation.x = -Math.PI/2;
carpet.position.y = 0.01;
scene.add(carpet);

const ceiling = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({ color:0x0a0015, roughness:1, side: THREE.DoubleSide })
);
ceiling.rotation.x = Math.PI/2;
ceiling.position.y = 8;
scene.add(ceiling);

// ================= СТЕНЫ =================
const wallMat = new THREE.MeshStandardMaterial({ color:0x2a1048, roughness:0.9 });
const HW = 25, WH = 8;

function makeWall(x, z, rotY) {
  const w = new THREE.Mesh(new THREE.BoxGeometry(HW*2, WH, 0.5), wallMat);
  w.position.set(x, WH/2, z);
  w.rotation.y = rotY;
  w.receiveShadow = true;
  scene.add(w);
}
makeWall(0, -HW, 0);
makeWall(0,  HW, 0);
makeWall(-HW, 0, Math.PI/2);
makeWall( HW, 0, Math.PI/2);

function neonStrip(x, y, z, rotY, color) {
  const s = new THREE.Mesh(
    new THREE.BoxGeometry(24, 0.12, 0.06),
    new THREE.MeshBasicMaterial({ color })
  );
  s.position.set(x, y, z);
  s.rotation.y = rotY;
  scene.add(s);
}
neonStrip(0, 5.5, -24.7, 0, 0xff00ff);
neonStrip(0, 5.5,  24.7, 0, 0x00ffff);
neonStrip(-24.7, 5.5, 0, Math.PI/2, 0xffd700);
neonStrip( 24.7, 5.5, 0, Math.PI/2, 0x00ff88);

// ================= JUMBO SLOT =================
const machines = [];

function makeSymbolTex(symbol) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f5f0e0';
  ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 4;
  ctx.strokeRect(6, 6, 116, 116);
  ctx.font = '80px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';
  ctx.fillText(symbol, 64, 68);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  return tex;
}

function makeHeaderTex() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0, '#1a0a00');
  grad.addColorStop(0.5, '#3a1500');
  grad.addColorStop(1, '#1a0a00');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 128);
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 6;
  ctx.strokeRect(4, 4, 504, 120);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 52px Georgia';
  ctx.fillStyle = '#000';
  ctx.fillText('JUMBO', 256, 42);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('JUMBO', 254, 40);
  ctx.font = 'bold 44px Georgia';
  ctx.fillStyle = '#000';
  ctx.fillText('SLOT', 256, 92);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('SLOT', 254, 90);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  return tex;
}

function createJumboSlot(x, z, rotY) {
  const g = new THREE.Group();
  const chromeMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 1.0, roughness: 0.15 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.7, roughness: 0.4 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.2, 0.7), chromeMat);
  body.position.y = 1.1;
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);

  const sidePanel = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.6, 0.72), darkMat);
  sidePanel.position.set(-0.51, 1.1, 0);
  g.add(sidePanel);

  const headerTex = makeHeaderTex();
  const headerMat = new THREE.MeshStandardMaterial({
    map: headerTex, emissive: 0xffffff, emissiveMap: headerTex,
    emissiveIntensity: 0.3, roughness: 0.5
  });
  const header = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.5), headerMat);
  header.position.set(0, 1.95, 0.37);
  g.add(header);

  const headerFrame = new THREE.Mesh(
    new THREE.BoxGeometry(1.02, 0.56, 0.04),
    new THREE.MeshStandardMaterial({ color:0xffd700, metalness:1, roughness:0.2 })
  );
  headerFrame.position.set(0, 1.95, 0.34);
  g.add(headerFrame);

  const reelPanel = new THREE.Mesh(new THREE.BoxGeometry(0.94, 0.55, 0.05), darkMat);
  reelPanel.position.set(0, 1.45, 0.36);
  g.add(reelPanel);

  const reels = [];
  for (let i = 0; i < 3; i++) {
    const reelTex = makeSymbolTex('🍒');
    const reelMat = new THREE.MeshStandardMaterial({
      map: reelTex, emissive: 0xffffff, emissiveMap: reelTex,
      emissiveIntensity: 0.15, roughness: 0.4
    });
    const reel = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.45), reelMat);
    reel.position.set(-0.3 + i*0.3, 1.45, 0.40);
    g.add(reel);

    const frame = new THREE.Mesh(
      new THREE.BoxGeometry(0.27, 0.48, 0.02),
      new THREE.MeshStandardMaterial({ color:0xffd700, metalness:1, roughness:0.2 })
    );
    frame.position.set(-0.3 + i*0.3, 1.45, 0.375);
    g.add(frame);

    reels.push({ mesh: reel, canvas: reelTex.image, tex: reelTex });
  }

  const decoMat = new THREE.MeshBasicMaterial({ color: 0xff2200 });
  for (let s = -1; s <= 1; s += 2) {
    for (let j = 0; j < 3; j++) {
      const d = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 0.12), decoMat);
      d.position.set(s * 0.42, 1.55 - j*0.15, 0.39);
      g.add(d);
    }
  }

  const lowerCanvas = document.createElement('canvas');
  lowerCanvas.width = 512; lowerCanvas.height = 128;
  const lctx = lowerCanvas.getContext('2d');
  const lg = lctx.createLinearGradient(0, 0, 0, 128);
  lg.addColorStop(0, '#1a0a00');
  lg.addColorStop(0.5, '#3a1500');
  lg.addColorStop(1, '#1a0a00');
  lctx.fillStyle = lg;
  lctx.fillRect(0, 0, 512, 128);
  lctx.strokeStyle = '#ffd700';
  lctx.lineWidth = 4;
  lctx.strokeRect(4, 4, 504, 120);
  lctx.textAlign = 'center';
  lctx.textBaseline = 'middle';
  lctx.fillStyle = '#ff3300';
  lctx.font = 'bold 60px Georgia';
  lctx.fillText('7 7 7', 256, 45);
  lctx.fillStyle = '#ffd700';
  lctx.font = 'bold 32px Georgia';
  lctx.fillText('BARS & 7s WINS', 256, 95);

  const lowerTex = new THREE.CanvasTexture(lowerCanvas);
  const lowerMat = new THREE.MeshStandardMaterial({
    map: lowerTex, emissive: 0xffffff, emissiveMap: lowerTex,
    emissiveIntensity: 0.25, roughness: 0.5
  });
  const lowerPanel = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.42), lowerMat);
  lowerPanel.position.set(0, 0.7, 0.36);
  g.add(lowerPanel);

  const lowerFrame = new THREE.Mesh(
    new THREE.BoxGeometry(0.96, 0.48, 0.03),
    new THREE.MeshStandardMaterial({ color:0xffd700, metalness:1, roughness:0.25 })
  );
  lowerFrame.position.set(0, 0.7, 0.345);
  g.add(lowerFrame);

  const tray = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.12, 0.15),
    new THREE.MeshStandardMaterial({ color:0x222222, metalness:0.9, roughness:0.2 })
  );
  tray.position.set(0, 0.35, 0.35);
  g.add(tray);

  const leverPivot = new THREE.Group();
  leverPivot.position.set(0.62, 1.2, 0.0);
  g.add(leverPivot);

  const rod = new THREE.Mesh(
    new THREE.CylinderGeometry(0.028, 0.028, 0.9, 10),
    new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 1.0, roughness: 0.25 })
  );
  rod.position.y = 0.45;
  rod.castShadow = true;
  leverPivot.add(rod);

  const mount = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.06, 0.15, 12),
    new THREE.MeshStandardMaterial({ color:0x333333, metalness:0.8, roughness:0.3 })
  );
  mount.rotation.z = Math.PI/2;
  leverPivot.add(mount);

  const ballMat = new THREE.MeshStandardMaterial({
    color: 0xff1133, metalness: 0.1, roughness: 0.15,
    emissive: 0x880011, emissiveIntensity: 0.4
  });
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.09, 24, 24), ballMat);
  ball.position.y = 0.92;
  ball.castShadow = true;
  leverPivot.add(ball);

  const ballGlow = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xff2233, transparent: true, opacity: 0.25 })
  );
  ballGlow.position.y = 0.92;
  leverPivot.add(ballGlow);

  leverPivot.rotation.z = 0.15;

  const topLampBase = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.09, 0.15, 12),
    new THREE.MeshStandardMaterial({ color:0xcccccc, metalness:1, roughness:0.2 })
  );
  topLampBase.position.y = 2.4;
  g.add(topLampBase);

  const topLamp = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.07, 0.18, 12),
    new THREE.MeshBasicMaterial({ color:0xff88aa })
  );
  topLamp.position.y = 2.56;
  g.add(topLamp);

  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  scene.add(g);

  const machine = {
    group: g, leverPivot, ball, reels,
    symbols: ['🍒','🍒','🍒'],
    spinning: false, spinTime: 0, result: null,
    x, z
  };
  machines.push(machine);
  return machine;
}

const layout = [
  { x:-24, z:-9,  r: Math.PI/2 },
  { x:-24, z:-4,  r: Math.PI/2 },

// ================= ИГРОК =================
const player = {
  pos: new THREE.Vector3(0, 1.65, 20),
  yaw: Math.PI,
  pitch: 0,
  speed: 3.6
};

// Общие переменные ввода
let moveInput = { x: 0, y: 0 };     // -1..1 от джойстика / WASD
let lookDeltaX = 0, lookDeltaY = 0; // накопленный поворот (мышь/свайп)

// ============================================================
//  🖥️ ПК-УПРАВЛЕНИЕ (WASD + мышь + E + M)
// ============================================================
const keysDown = {};

function setupPCControls() {
  // Клавиатура
  window.addEventListener('keydown', (e) => {
    keysDown[e.code] = true;

    // E — действие
    if (e.code === 'KeyE') doAction();

    // M — музыка
    if (e.code === 'KeyM') {
      if (musicPlaying) stopMusic();
      else startMusic();
    }
  });
  window.addEventListener('keyup', (e) => {
    keysDown[e.code] = false;
  });

  // Мышь — обзор (Pointer Lock)
  const canvas = renderer.domElement;
  canvas.addEventListener('click', () => {
    if (!document.pointerLockElement) {
      canvas.requestPointerLock();
    }
  });

  document.addEventListener('pointerlockchange', () => {
    // ничего не делаем, просто блокируем курсор
  });

  document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === canvas) {
      lookDeltaX += e.movementX * 0.0025;
      lookDeltaY += e.movementY * 0.002;
    }
  });

  // Клик левой кнопкой мыши = действие (если не в Pointer Lock)
  canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0 && !document.pointerLockElement) {
      doAction();
    }
  });
}

// ============================================================
//  📱 ТЕЛЕФОН — джойстик + свайп
// ============================================================
function setupPhoneControls() {
  const stickKnob = document.getElementById('stickKnob');
  let stickTouchId = null;
  let stickCX = 0, stickCY = 0;
  const STICK_RADIUS = 42;

  function findTouch(touchList, id) {
    for (let i = 0; i < touchList.length; i++) {
      if (touchList[i].identifier === id) return touchList[i];
    }
    return null;
  }

  function handleStickMove(x, y) {
    let dx = x - stickCX;
    let dy = y - stickCY;
    const dist = Math.hypot(dx, dy);
    if (dist > STICK_RADIUS) {
      dx = dx / dist * STICK_RADIUS;
      dy = dy / dist * STICK_RADIUS;
    }
    stickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    moveInput.x = dx / STICK_RADIUS;
    moveInput.y = dy / STICK_RADIUS;
  }

  stickEl.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (stickTouchId !== null) return;
    const t = e.changedTouches[0];
    stickTouchId = t.identifier;
    const r = stickEl.getBoundingClientRect();
    stickCX = r.left + r.width/2;
    stickCY = r.top + r.height/2;
    handleStickMove(t.clientX, t.clientY);
  }, { passive: false });

  stickEl.addEventListener('touchmove', (e) => {
    if (stickTouchId === null) return;
    e.preventDefault();
    e.stopPropagation();
    const t = findTouch(e.touches, stickTouchId);
    if (t) handleStickMove(t.clientX, t.clientY);
  }, { passive: false });

  function stickEnd(e) {
    if (stickTouchId === null) return;
    const stillTouching = findTouch(e.touches, stickTouchId);
    if (stillTouching) return;
    stickTouchId = null;
    stickKnob.style.transform = 'translate(-50%,-50%)';
    moveInput.x = 0;
    moveInput.y = 0;
  }
  stickEl.addEventListener('touchend', stickEnd);
  stickEl.addEventListener('touchcancel', stickEnd);

  // Свайп для обзора
  const gameEl = document.getElementById('game');
  let lookTouchId = null;
  let lastLookX = 0, lastLookY = 0;
  let lookMoved = false;

  gameEl.addEventListener('touchstart', (e) => {
    if (e.target.closest('button') || e.target.closest('#stick')) return;
    if (lookTouchId !== null) return;
    const t = e.changedTouches[0];
    lookTouchId = t.identifier;
    lastLookX = t.clientX;
    lastLookY = t.clientY;
    lookMoved = false;
  }, { passive: false });

  gameEl.addEventListener('touchmove', (e) => {
    if (lookTouchId === null) return;
    const t = findTouch(e.touches, lookTouchId);
    if (!t) return;
    e.preventDefault();
    const dx = t.clientX - lastLookX;
    const dy = t.clientY - lastLookY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) lookMoved = true;
    lookDeltaX += dx * 0.005;
    lookDeltaY += dy * 0.004;
    lastLookX = t.clientX;
    lastLookY = t.clientY;
  }, { passive: false });

  gameEl.addEventListener('touchend', (e) => {
    if (lookTouchId === null) return;
    const stillTouching = findTouch(e.touches, lookTouchId);
    if (stillTouching) return;
    if (!lookMoved) doAction();
    lookTouchId = null;
    lookDeltaX = 0;
    lookDeltaY = 0;
  });

  gameEl.addEventListener('touchcancel', (e) => {
    if (lookTouchId === null) return;
    const stillTouching = findTouch(e.touches, lookTouchId);
    if (stillTouching) return;
    lookTouchId = null;
    lookDeltaX = 0;
    lookDeltaY = 0;
  });
}

// ================= RAYCASTER =================
const raycaster = new THREE.Raycaster();
raycaster.far = 4.0;

function checkAim() {
  if (spinning) { nearMachine = null; return; }
  raycaster.setFromCamera({ x:0, y:0 }, camera);
  const balls = machines.map(m => {
    m.ball.userData.machine = m;
    return m.ball;
  });
  const hits = raycaster.intersectObjects(balls, false);
  if (hits.length > 0) {
    const m = hits[0].object.userData.machine;
    const dx = m.x - player.pos.x;
    const dz = m.z - player.pos.z;
    if (Math.hypot(dx, dz) < 3.5) {
      nearMachine = m;
      return;
    }
  }
  nearMachine = null;
}

// ================= UI =================
function updateHUD() {
  document.getElementById('balance').textContent = balance;
}

let hintTimeout;
function showHint(text, ms = 1500) {
  const h = document.getElementById('hint');
  h.textContent = text;
  h.style.display = 'block';
  clearTimeout(hintTimeout);
  hintTimeout = setTimeout(() => { h.style.display = 'none'; }, ms);
}

function updateReelTexture(reel, symbol) {
  const c = reel.canvas;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f5f0e0';
  ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 4;
  ctx.strokeRect(6, 6, 116, 116);
  ctx.font = '80px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';
  ctx.fillText(symbol, 64, 68);
  reel.tex.needsUpdate = true;
}

const SYMBOLS = ['🍒','🍋','🍊','🍇','⭐','💎','7️⃣'];
const WEIGHTS = [30, 25, 20, 12, 7, 4, 2];
function pickSymbol() {
  const total = WEIGHTS.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for (let i=0;i<SYMBOLS.length;i++) {
    r -= WEIGHTS[i];
    if (r <= 0) return SYMBOLS[i];
  }
  return SYMBOLS[0];
}

function pullLever(m) {
  if (m.spinning || spinning) return;
  if (balance < BET) {
    showHint('❌ Недостаточно денег!', 2000);
    return;
  }
  m.leverPivot.rotation.z = -0.75;
  balance -= BET;
  updateHUD();
  m.spinning = true;
  spinning = true;
  m.spinTime = 0;
  m.result = [pickSymbol(), pickSymbol(), pickSymbol()];
  if (navigator.vibrate) navigator.vibrate(40);
  showHint('🎰 Крутим...', 1500);
  playSpinSound();
}

function updateMachineSpin(m, dt) {
  if (!m.spinning) return;
  m.spinTime += dt;

  for (let i = 0; i < 3; i++) {
    const stopAt = 1.0 + i * 0.7;
    if (m.spinTime < stopAt) {
      if (Math.random() < 0.4) {
        const s = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
        m.symbols[i] = s;
        updateReelTexture(m.reels[i], s);
      }
    } else if (m.symbols[i] !== m.result[i]) {
      m.symbols[i] = m.result[i];
      updateReelTexture(m.reels[i], m.result[i]);
      playReelStop();
    }
  }

  m.leverPivot.rotation.z += (0.15 - m.leverPivot.rotation.z) * dt * 5;

  if (m.spinTime > 1.0 + 2*0.7 + 0.4) {
    m.spinning = false;
    spinning = false;
    m.symbols = m.result.slice();
    finishSpin(m, m.result);
  }
}

function finishSpin(m, r) {
  let win = 0, text = '';
  if (r[0] === r[1] && r[1] === r[2]) {
    if (r[0] === '7️⃣') win = BET * 50;
    else if (r[0] === '💎') win = BET * 25;
    else if (r[0] === '⭐') win = BET * 15;
    else win = BET * 10;
    text = `🎉 ДЖЕКПОТ! +${win} ₽`;
    playJackpotSound();
  } else if (r[0] === r[1] || r[1] === r[2] || r[0] === r[2]) {
    win = BET * 2;
    text = `✨ Совпадение! +${win} ₽`;
    playWinSound();
  } else {
    text = '😢 Не повезло...';
    playLoseSound();
  }
  if (win > 0) {
    balance += win;
    updateHUD();
    if (navigator.vibrate) navigator.vibrate([50,50,50]);
  }
  showHint(text, 2500);
}

function doAction() {
  if (nearMachine && !spinning) pullLever(nearMachine);
}
document.getElementById('actionBtn').addEventListener('touchstart', (e) => {
  e.preventDefault(); e.stopPropagation(); doAction();
}, { passive:false });
document.getElementById('actionBtn').addEventListener('click', (e) => {
  e.stopPropagation(); doAction();
});

// ============================================================
//  🎵 МУЗЫКА
// ============================================================
let audioCtx = null;
let musicPlaying = false;
let musicGain = null;
let customMusicEl = null;
let musicTimer = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.12;
    musicGain.connect(audioCtx.destination);
  } catch (e) {}
}

const bassNotes = [110, 130.81, 146.83, 164.81, 174.61, 164.81, 146.83, 130.81];
const melodyNotes = [440, 523.25, 659.25, 523.25, 587.33, 698.46, 587.33, 523.25];
let musicStep = 0;

function playMusicStep() {
  if (!audioCtx || !musicPlaying || USE_CUSTOM_MUSIC) return;
  const now = audioCtx.currentTime;

  const bassOsc = audioCtx.createOscillator();
  const bassGain = audioCtx.createGain();
  bassOsc.type = 'sawtooth';
  bassOsc.frequency.value = bassNotes[musicStep % bassNotes.length];
  bassGain.gain.setValueAtTime(0, now);
  bassGain.gain.linearRampToValueAtTime(0.15, now + 0.02);
  bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  bassOsc.connect(bassGain);
  bassGain.connect(musicGain);
  bassOsc.start(now);
  bassOsc.stop(now + 0.45);

  if (musicStep % 2 === 0) {
    const melOsc = audioCtx.createOscillator();
    const melGain = audioCtx.createGain();
    melOsc.type = 'triangle';
    melOsc.frequency.value = melodyNotes[Math.floor(musicStep/2) % melodyNotes.length];
    melGain.gain.setValueAtTime(0, now);
    melGain.gain.linearRampToValueAtTime(0.08, now + 0.02);
    melGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    melOsc.connect(melGain);
    melGain.connect(musicGain);
    melOsc.start(now);
    melOsc.stop(now + 0.4);
  }

  musicStep++;
}

function startMusic() {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();

  if (musicPlaying) return;
  musicPlaying = true;

  if (USE_CUSTOM_MUSIC) {
    if (!customMusicEl) {
      customMusicEl = new Audio(MUSIC_URL);
      customMusicEl.loop = true;
      customMusicEl.volume = 0.5;
    }
    customMusicEl.play().catch(() => {
      // Файл не найден — используем синтез
      console.warn('Не удалось загрузить', MUSIC_URL, '→ синтез-музыка');
      musicTimer = setInterval(playMusicStep, 280);
    });
  } else {
    musicTimer = setInterval(playMusicStep, 280);
  }
  updateMusicBtn();
}

function stopMusic() {
  musicPlaying = false;
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  if (customMusicEl) customMusicEl.pause();
  updateMusicBtn();
}

function updateMusicBtn() {
  const btn = document.getElementById('musicBtn');
  if (musicPlaying) {
    btn.textContent = '🔊';
    btn.classList.remove('off');
  } else {
    btn.textContent = '🔇';
    btn.classList.add('off');
  }
}

document.getElementById('musicBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (musicPlaying) stopMusic();
  else startMusic();
});

function playTone(freq, duration, type = 'square', vol = 0.15) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(vol, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, now + duration);
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + duration + 0.02);
}

function playSpinSound()  { playTone(200, 0.15, 'square', 0.1); }
function playReelStop()   { playTone(600, 0.12, 'square', 0.15); }
function playWinSound()   { playTone(880, 0.2, 'triangle', 0.2); setTimeout(() => playTone(1100, 0.3, 'triangle', 0.2), 100); }
function playJackpotSound() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.25, 'triangle', 0.25), i*100));
}
function playLoseSound()  { playTone(150, 0.3, 'sawtooth', 0.1); }

// ================= ИГРОВОЙ ЦИКЛ =================
let lastTime = performance.now();
let fpsFrames = 0, fpsTimer = 0;
const fpsEl = document.getElementById('fps');

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  fpsFrames++;
  fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    fpsEl.textContent = `FPS: ${Math.round(fpsFrames / fpsTimer)}`;
    fpsFrames = 0;
    fpsTimer = 0;
  }

  // Если игра ещё не началась — ждём
  if (!controlMode) {
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
    return;
  }

  // Поворот камеры
  if (lookDeltaX !== 0) {
    player.yaw -= lookDeltaX;
    lookDeltaX = 0;
  }
  if (lookDeltaY !== 0) {
    player.pitch -= lookDeltaY;
    player.pitch = Math.max(-1.1, Math.min(1.1, player.pitch));
    lookDeltaY = 0;
  }

  // === ВВОД ДВИЖЕНИЯ ===
  let inputX = 0, inputY = 0;

  if (controlMode === 'pc') {
    // WASD
    if (keysDown['KeyW'] || keysDown['ArrowUp'])    inputY -= 1;
    if (keysDown['KeyS'] || keysDown['ArrowDown'])  inputY += 1;
    if (keysDown['KeyA'] || keysDown['ArrowLeft'])  inputX -= 1;
    if (keysDown['KeyD'] || keysDown['ArrowRight']) inputX += 1;
  } else {
    // Джойстик
    inputX = moveInput.x;
    inputY = moveInput.y;
  }

  // Движение относительно камеры
  const fx = -Math.sin(player.yaw);
  const fz = -Math.cos(player.yaw);
  const rx =  Math.cos(player.yaw);
  const rz = -Math.sin(player.yaw);

  const moveX = (fx * (-inputY) + rx * inputX);
  const moveZ = (fz * (-inputY) + rz * inputX);
  const mag = Math.hypot(moveX, moveZ);

  if (mag > 0.05) {
    const spd = player.speed * dt;
    const dx = moveX * spd;
    const dz = moveZ * spd;

    const lim = 23.5;
    const nx = player.pos.x + dx;
    const nz = player.pos.z + dz;
    if (nx > -lim && nx < lim) player.pos.x = nx;
    if (nz > -lim && nz < lim) player.pos.z = nz;

    for (let i = 0; i < machines.length; i++) {
      const m = machines[i];
      const ddx = player.pos.x - m.x;
      const ddz = player.pos.z - m.z;
      const d = Math.hypot(ddx, ddz);
      if (d < 0.9 && d > 0.001) {
        const push = (0.9 - d) / d;
        player.pos.x += ddx * push;
        player.pos.z += ddz * push;
      }
    }
  }

  camera.position.copy(player.pos);
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  checkAim();

  const crosshair = document.getElementById('crosshair');
  const btn = document.getElementById('actionBtn');

  if (nearMachine && !spinning) {
    crosshair.classList.add('target');
    // Кнопку показываем только на телефоне
    if (controlMode === 'phone') {
      btn.style.display = 'block';
    } else {
      btn.style.display = 'none';
    }
  } else {
    crosshair.classList.remove('target');
    btn.style.display = 'none';
  }

  for (let i = 0; i < machines.length; i++) {
    updateMachineSpin(machines[i], dt);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }, 200);
});

// ================= PWA =================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(() => {});
}

requestAnimationFrame(loop);
